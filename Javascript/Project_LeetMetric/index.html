<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetric WebApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="body_container">
        <div class="large_container">
        <div class="heading">
            <h1 id="heading">LeetMetric</h1>
        </div>
        <div class="search_container">
            <form action="">
                <label for="username" id="text" style="color: white; font-weight: 600; ">Enter Your Username below:</label>
                <br>
                <div class="search-bar">
                    <input type="text" id="username" placeholder="Enter Your username here..." style="width: 70%;border-radius: 6.25px; padding: 0.2rem;">
                <button id="search-button" style="width: 20%; border-radius: 6.25px; padding: 0.2rem;">Search</button>
                </div>
            </form>
        </div>
        <div class="cards">
            <div class="carditem one">Easy</div>
            <div class="carditem two">Meduim</div>
            <div class="carditem three">Hard</div>
        </div>
    </div>
    </div>



    <script src="script.js"></script>
</body>
</html>

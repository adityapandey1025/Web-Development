<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Course Registration</title>
  <link rel="stylesheet" href="form.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="reg-wrap">
    <div class="reg-header">
      <div class="reg-header-icon">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" fill="white"/>
        </svg>
      </div>
      <div>
        <h2>Student Course Registration</h2>
        <p>KIET Deemed To Be University</p>
      </div>
    </div>

    <div class="reg-card">

      <div class="section-label">Personal information</div>

      <div class="field-row">
        <div class="field-group">
          <label for="fname">First name</label>
          <input type="text" id="fname" name="fname" placeholder="John" required>
        </div>
        <div class="field-group">
          <label for="lname">Last name</label>
          <input type="text" id="lname" name="lname" placeholder="Doe" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="mail">Email address</label>
          <input type="email" id="mail" name="mail" placeholder="john@example.com">
        </div>
        <div class="field-group">
          <label for="number">Phone number</label>
          <input type="tel" id="number" name="number" maxlength="10" placeholder="+91 99999 99999">
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="fatherName">Father's name</label>
          <input type="text" id="fatherName" name="fatherName" placeholder="Father's name" required>
        </div>
        <div class="field-group">
          <label for="motherName">Mother's name</label>
          <input type="text" id="motherName" name="motherName" placeholder="Mother's name" required>
        </div>
      </div>

      <div class="section-label">Academic details</div>

      <div class="field-row">
        <div class="field-group">
          <label for="roll">Roll number</label>
          <input type="text" id="roll" maxlength="12" name="roll" placeholder="e.g. 2401CS001" required>
        </div>
        <div class="field-group">
          <label for="session">Session</label>
          <select id="session" name="session" required>
            <option value="" selected disabled hidden>Select session</option>
            <option value="2023">2023–27</option>
            <option value="2024">2024–28</option>
            <option value="2025">2025–29</option>
            <option value="2026">2026–30</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="course">Course</label>
          <select id="course" name="course" required>
            <option value="" selected disabled hidden>Select course</option>
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="mba">MBA</option>
          </select>
        </div>
        <div class="field-group">
          <label for="program">Program</label>
          <select id="program" name="program" required>
            <option value="" selected disabled hidden>Select program</option>
            <option value="regular">Regular</option>
            <option value="lateral">Lateral</option>
            <option value="diploma">Diploma</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="college">College</label>
          <select id="college" name="College" required>
            <option value="" selected disabled hidden>Select college</option>
            <option value="kiet">KIET Deemed To Be University</option>
          </select>
        </div>
        <div class="field-group">
          <label for="section">Section</label>
          <select id="section" name="section" required>
            <option value="" selected disabled hidden>Select section</option>
            <option value="a">A</option>
            <option value="b">B</option>
            <option value="c">C</option>
          </select>
        </div>
      </div>

      <div class="section-label">Fee &amp; accommodation</div>

      <div class="field-row">
        <div class="field-group">
          <label for="fee-type">Fee type</label>
          <select id="fee-type" name="fee-type" required>
            <option value="" selected disabled hidden>Select fee type</option>
            <option value="Tuition">Tuition</option>
            <option value="Hostel">Hostel</option>
            <option value="Exam">Exam</option>
            <option value="full">Full</option>
          </select>
        </div>
        <div class="field-group">
          <label for="bankType">Payment method</label>
          <select id="bankType" name="bank">
            <option value="" selected disabled hidden>Select method</option>
            <option value="cash">Cash</option>
            <option value="online">Online</option>
            <option value="upi">UPI</option>
          </select>
        </div>
      </div>

      <div class="field-full">
        <div class="field-group">
          <label>Accommodation type</label>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" name="accomodation-type" id="hostel" value="hostel" checked>
              Hostel
            </label>
            <label class="radio-item">
              <input type="radio" name="accomodation-type" id="day" value="day">
              Day Scholar
            </label>
            <label class="radio-item">
              <input type="radio" name="accomodation-type" id="pg" value="pg">
              PG
            </label>
          </div>
        </div>
      </div>

      <div class="field-full">
        <div class="field-group">
          <label>Receipt number</label>
          <div class="receipt-row">
            <input class="receipt-input" type="text" id="receiptNum" placeholder="Click to generate" readonly>
            <button class="generate-btn" id="reciptBtn" type="button">Generate</button>
          </div>
        </div>
      </div>    

      <div class="form-actions">
        <input type="reset" value="Reset" class="btn-reset" id="resetBtn">
        <input type="submit" value="Submit Registration" class="btn-submit" id="submitBtn">
      </div>

    </div>
  </div>

<script src="form.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="box">
            <div class="nav">
        <h2 style="text-align: center;">Student Course Registeration</h2>
    </div>
    <form action="recipt.html">
        <label for="fname">Enter First Name</label>
        <input type="text" name="fname" id="fname" required >

        <label for="lname">Enter Last Name</label>
        <input type="text" name="lname" id="lname" required>

        <label for="mail">Enter Your Email</label>
        <input type="email" name="" id="mail">

        <label for="number">Enter Phone Number</label>
        <input type="tel" name="" id="number">

        <label for="fatherName">Enter Father Name</label>
        <input type="text" name="fatherName" id="fatherName" required>

        <label for="motherName">Enter Mother Name</label>
        <input type="text" name="motherName" id="motherName" required>

        <label for="session">Select Session</label>
        <select name="session" id="session" required>
            <option value="Session" selected disabled hidden>--Session--</option>
            <option value="2023">2023-27</option>
            <option value="2024">2024-28</option>
            <option value="2025">2025-29</option>
            <option value="2026">2030-30</option>
        </select>

        <label for="roll">Enter Roll Number</label>
        <input type="text" name="" id="roll" required>

        <label for="course">Select Course</label>
        <select name="course" id="course" required>
            <option value="Session" selected disabled hidden>--Course--</option>
            <option value="btech">B.Tech</option>
            <option value="mba">M.Tech</option>
            <option value="mtech">MBA</option>
        </select>

        <label for="program">Select Program</label>
        <select name="program" id="session" required>
            <option value="Session" selected disabled hidden>--Program--</option>
            <option value="regular">Regular</option>
            <option value="lateral">Lateral</option>
            <option value="diploma">Diploma</option>
        </select>

        <label for="College">Select College</label>
        <select name="College" id="college" required>
            <option value="college" selected disabled hidden>--College--</option>
            <option value="regular">KIET Deemed To Be University</option>
        </select>

        <label for="section">Select Section</label>
        <select name="section" id="section" required>
            <option value="section" selected disabled hidden>--Section--</option>
            <option value="a">A</option>
            <option value="b">B</option>
            <option value="c">C</option>
        </select>

        <label for="fee-type">Select Fee-Type</label>
        <select name="fee-type" id="fee-type" required>
            <option value="section" selected disabled hidden>--Fee-Type--</option>
            <option value="Tuition">Tuition</option>
            <option value="Hostel">Hostel</option>
            <option value="Exam">Exam</option>
            <option value="full">Full</option>
        </select>

        <label for="accomodation">Accommodation Type :: <br></label>
        <label for="hostel">Hostel</label>
        <input type="radio" name="accomodation-type" id="hostel" checked>
        <label for="day">Day Scholar</label>
        <input type="radio" name="accomodation-type" id="day">
        <label for="pg">PG</label>
        <input type="radio" name="accomodation-type" id="pg">
        <br>
        <label for="bankType">Bank-Type</label>
        <select name="bank" id="bankType">
            <option value=""selected disabled hidden>--Bank Type--</option>
            <option value="cash">Cash</option>
            <option value="online">Online</option>
            <option value="upi">UPI</option>
        </select>

        <label for="recipt">Generate Recipt Number</label>
        <button id="reciptBtn">Click to Generate</button>
        <br>
        <input type="reset" value="RESET">
        <input type="submit" value="SUBMIT">
    </form>
    </div>
</body>
</html>

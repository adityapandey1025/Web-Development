<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
    </head>
    <body>
    <h1>Job Application</h1>
    <label for="name">Name:</label><br>
    <input type="text" name="" id="name" placeholder="Enter your name"><br>
    <label for="email">Email:</label><br>
    <input type="text" name="" id="email" placeholder="Enter your email"><br>
    <label for="phone">Phone:</label><br>
    
    <input type="tel" name="" id="phone" placeholder="9118*****82"><br>
    <label for="resume">Resume:</label><br>
    <input type="file" name="" id="resume" ><br>
    <label for="experience">Experience(years):</label><br>
    <input type="number" name="" id="experience" min="0" max="40"><br>
    <fieldset>
        <legend>Skills:</legend>
        <input type="checkbox" name="" id="checkbox" ><br>
        <label for="checkbox">HTML</label><br>
        <input type="checkbox" name="" id="checkbox" ><br>
        <label for="checkbox">CSS</label><br>
        <input type="checkbox" name="" id="checkbox" ><br>
        <label for="checkbox">JavaScript</label><br>
    </fieldset>
    <label for="Highest Education:">Highest Education:</label><br>
    <select name="" id="Highest Education" >
        <option value="" disabled selected>--Education--</option>
        <option value="1">High School</option>
        <option value="2">Intermediate</option>
        <option value="3">Graduate</option>
        <option value="4">PHD</option>
    </select>   <br>
    
    <label for="radio">Availability:</label><br>
    <input type="radio" name="job_time" id="radio1"><br>
    <label for="radio1">Full-time</label><br>
    <input type="radio" name="job_time" id="radio2"><br>
    <label for="radio2">Part-time</label><br>
    <label for="">Additional Comments:</label><br>
    <textarea name="area" id="" rows="5" cols="67"></textarea>
    <button>Submit Application</button>

   
    </body>
</html>

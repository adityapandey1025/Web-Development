<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
    </head>
    <body>
    <h1>Event Registeration</h1>
    <form action="">
        <label for="name">Name:<span style="color: red;">*</span></label><br>
        <input type="text" name="" id="name" placeholder="Enter Name" required ><br>
        <label for="gender">Gender:</label>
        <input type="radio" name="1" id="male">
        <label for="male">Male</label>
        <input type="radio" name="1" id="fem">
        <label for="fem">Female</label>
        <input type="radio" name="1" id="cus">
        <label for="cus">Custom</label>
        <br>
        <label for="email">Email:</label><br>
        <input type="text" name="" id="email" placeholder="abc123@gmail.com"><br>
        <label for="phone"  >Phone:</label><br>
        <input type="tel" name="" id="phone" placeholder="Enter Contact No." required><br>
        <label for="select">Occupations:</label><br>
        <select name="" id="select">
            <option value="1">Agriculture</option>
            <option value="2">Business</option>
            <option value="3">Private Employee</option>
            <option value="4">Government Employee</option>
        </select><br>
        <fieldset>
            <legend>Topics of Internet:</legend>
            <input type="checkbox" name="html" id="html"><br>
        <label for="html">HTML</label><br>
        <input type="checkbox" name="css" id="css"><br>
        <label for="css">CSS</label><br>
        <input type="checkbox" name="JavaScript" id="JavaScript"><br>
        <label for="JavaScript">JavaScript</label><br>
        </fieldset>
        <label for="">Comments::</label><br>
        <textarea name="" id="area" rows="3" cols="55"></textarea>
        <input type="submit" name="" value="Register" id="">
        
    </form>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn HTML and CSS basics with easy tutorials and examples. Perfect for beginners.">
    <meta name="keywords" content="html, css, web development, frontend, tutorial">

    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>You</legend>
            <label for="email">Enter Email: </label>
            <input type="text" id="email" placeholder="Enter your mail">
            <br>
            <br>
            <label for="pass">Enter Password: </label>
            <input type="password" id="pass" placeholder="Enter your password">
            <br>
            <br>
            <label for="male">Male</label>
            <input type="radio" name="radio" id="male" checked>
            <label for="female">Female</label>
            <input type="radio" name="female" id="male" >
            <label for="custom">Custom</label>
            <input type="radio" name="radio" id="custom" >
            <label for="not">Rather not to Say</label>
            <input type="radio" name="radio" id="not" >
            <br><br>
            <input type="submit" value="Click here to Submit">
            <input type="reset" name="" id="" value="reset">
            <br><br>
            <label for="hindi">Hindi</label>
            <input type="checkbox" name="" id="hindi">
            <label for="eng">English</label>
            <input type="checkbox" name="" id="eng" checked>
            <br><br>
            <label for="date">D.O.B: </label>
            <input type="date" name="" id="date">
            <br><br>
            <label for="select">Favourite Player</label>
            <select name="--Select--" id="select" >
                <option value="" disabled selected>--Select--</option>
                <option value="1">Kohli</option>
                <option value="2">Rohit</option>
                <option value="3">Dhawan</option>
            </select>
            <br><br>
            <textarea name="" id="" placeholder="Enter bla bla bla" rows="2" cols="50"></textarea>
            <br><br>
            <label for="time">Set Time: </label>
            <input type="time">
            <br><br>
            <label for="file">Click to Upload</label>
            <input type="file">
            <a href="https://www.instagram.com" target="_blank">Click</a>

        </fieldset>
        <details>
            <summary>Who are You?</summary>
            Lorem ipsum dolor sit amet.
        </details>
        
    </form>
    <iframe src="https://en.wikipedia.org/wiki/HTML" width="500" height="300"></iframe>

    <br><br>
    <iframe src="https://youtube.com/embed/e5eEUjDUh-k?autoplay=1&mute=1" frameborder="0"></iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Flexbox Layout</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border: 5px solid black;
    }

    .container > div {
        flex: 1 1 250px; /* grow, shrink, basis */
        max-width: 400px;
        min-width: 200px;
      height: 200px;
      color: white;
      font-size: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
    }

    .item1 {
      background-color: red;
      order: 3;
    }

    .item2 {
      background-color: yellow;
      color: black;
      order: 2;
    }

    .item3 {
      background-color: green;
      order: 4;
    }

    .item4 {
      background-color: blue;
      order: 1;
    }

    /* Optional: fine-tune layout for small screens */
    @media (max-width: 600px) {
      .container > div {
        flex: 1 1 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item1">Item1</div>
    <div class="item2">Item2</div>
    <div class="item3">Item3</div>
    <div class="item4">Item4</div>
  </div>
</body>
</html>

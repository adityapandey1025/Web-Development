<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 1200px;
            margin: 15px;
            border: 5px solid black;
            background-color: beige;
        }
        .box{
            width: 300px;
            height: 200px;
            background-color: aqua;
            border: 5px solid black;
            margin-top: 10px;
            margin-left: 10px;
            /* position: relative;
            left: 35vw; */
            /* transition-property: width; */
            transition-property: all;
            transition-duration: 3s;
            transition-delay: 5s;
            transition-timing-function: linear;
            transition: width 2s,height 3s;
        }
        .box:hover{
            width: 500px;
            background-color: brown;
            border-radius: 50%;
            height: 500px;
            border: 15px solid rgb(80, 14, 223);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 3px black solid;
            width: 250px;
            height: 250px;
            background-color: rgb(152, 147, 152);
            color: yellow;
        }
        @media (min-width:500px) and (max-width:900px){
            .container{
                background-color: black;
            }
        }


        .container1{
            display: flex;
            flex-direction: row;
        }
        .container1 >div{
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(81, 143, 92);
            font-size: 50px;
            font-weight: 900;
        }
        #box1{
            border: 3px black solid;
            background-color: red;
            width: 200px;
            height: 300px;
        }
        #box2{
            border: 3px black solid;
            background-color: green;
            width: 200px;
            height: 300px;
        }
        #box3{
            border: 3px black solid;
            background-color: yellow;
            width: 200px;
            height: 300px;
        }
        #box4{
            border: 3px black solid;
            background-color: blue;
            width: 200px;
            height: 300px;
        }
        @media (max-width:600px){
            .container1{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        Aditya
    </div>
    <br><br><br><br>
    <div class="container1">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
    </div>
</body>
</html>

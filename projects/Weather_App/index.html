<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <!-- SEARCH -->
    <div class="search">
      <input type="text" placeholder="enter city name" id="cityName">
      <button>
        <img src="images/search.png" alt="search">
      </button>
    </div>
     <div class="empty"></div>
    <div class="info">
    
          <!-- WEATHER -->
    <div class="weather">
      <img src="images/clear.png"  alt="weather">
      <h1 class="temp"></h1>
      <h2 class="city"></h2>
    </div>

    <!-- DETAILS -->
    <div class="details">

      <div class="col">
        <img src="images/humidity.png" alt="humidity">
        <div>
          <p></p>
          <span>Humidity</span>
        </div>
      </div>

      <div class="col">
        <img src="images/wind.png" alt="wind">
        <div>
          <p></p>
          <span>Wind Speed</span>
        </div>
      </div>

    </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/519185a7bc.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="card">
        <div class="top">
            <i class="fa-solid fa-heart" id="heart"></i>
            <i class="fa-solid fa-repeat" id="repeat"></i>
        </div>
        <div class="middle">
            <div class="animation">
                <img src="song_img.jpg" alt="" >
            </div>
        </div>
        <div class="lower">

            <audio src=""  id="audio"></audio>
            <input type="range" name="slider" id="slider" value="0">
            <div class="button">
                <div class="backward">
                    <i class="fa-solid fa-backward" id="backward"></i>
                </div>
                <div class="play_pause">
                    <i class="fa-solid fa-play" id="play"></i>
                    <i class="fa-solid fa-pause" id="pause"></i>
                </div>
                <div class="forward">
                    <i class="fa-solid fa-forward" id="forward"></i>
                </div>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
